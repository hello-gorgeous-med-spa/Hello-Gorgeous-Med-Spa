<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Gorgeous — Website Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#FF2D8E; --gold:#FFD700; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:'Inter',system-ui,sans-serif; }
  #stage{ position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform:translate(-50%,-50%); background:#000; overflow:hidden; }
  .poster{ position:absolute; inset:0; background:#000 url('assets/solaria.jpg') center 30%/cover no-repeat; }
  .imglayer{ position:absolute; inset:0; overflow:hidden; opacity:0; transition:opacity .8s ease; background:radial-gradient(circle at 50% 46%, rgba(255,45,142,0.20), rgba(0,0,0,0) 58%), #000; }
  .imglayer.on{ opacity:1; }
  .imglayer img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 5.4s ease; will-change:transform; }
  .vid{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .8s ease; }
  .vid.on{ opacity:1; }
  .scrim{ position:absolute; inset:0; background:
     linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 50%, rgba(0,0,0,.55) 76%, rgba(0,0,0,.9) 100%); }
  .topbar{ position:absolute; top:52px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .badge{ width:60px; height:60px; border-radius:15px; background:var(--pink); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:24px; color:#fff; }
  .brandname{ font-family:'Playfair Display',serif; font-weight:700; font-size:30px; color:#fff; line-height:1.05; }
  .brandsub{ font-weight:600; font-size:14px; letter-spacing:.32em; color:rgba(255,255,255,.72); }
  .award{ display:inline-flex; align-items:center; gap:9px; background:rgba(0,0,0,.38); border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(6px); padding:11px 20px; border-radius:999px; font-weight:700; font-size:16px; letter-spacing:.14em; text-transform:uppercase; color:#fff; }
  .caption{ position:absolute; left:64px; bottom:110px; max-width:1180px; transition:opacity .5s ease, transform .5s ease; }
  .rule{ width:76px; height:3px; background:var(--pink); margin-bottom:26px; }
  .eyebrow{ font-weight:700; font-size:22px; letter-spacing:.4em; text-transform:uppercase; color:var(--pink); margin-bottom:18px; }
  .title{ font-family:'Playfair Display',serif; font-weight:700; font-size:88px; line-height:1.03; color:#fff; letter-spacing:-.02em; }
  .title em{ font-style:italic; color:var(--pink); }
  .sub{ font-weight:500; font-size:30px; line-height:1.45; color:rgba(255,255,255,.85); margin-top:22px; }
  .cta{ position:absolute; right:64px; bottom:120px; display:flex; align-items:center; gap:26px; }
  .book{ font-weight:700; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:var(--pink); padding:22px 44px; border-radius:999px; box-shadow:0 14px 44px rgba(255,45,142,.45); }
  .phone{ font-weight:600; font-size:26px; color:#fff; }
  /* opening hook */
  #intro{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(0,0,0,.35); transition:opacity 1s ease; }
  #intro .k{ font-weight:700; font-size:22px; letter-spacing:.4em; text-transform:uppercase; color:var(--pink); margin-bottom:26px; }
  #intro .h{ font-family:'Playfair Display',serif; font-style:italic; font-weight:600; font-size:120px; line-height:1; color:#fff; letter-spacing:-.02em; }
  #intro .h span{ color:var(--pink); }
</style>
</head>
<body>
<div id="stage">
  <div class="poster"></div>
  <video class="vid" id="v0" muted playsinline preload="auto" poster="assets/solaria.jpg"></video>
  <video class="vid" id="v1" muted playsinline preload="auto"></video>
  <div class="imglayer" id="imglayer"><img id="imgEl" alt=""></div>
  <div class="scrim"></div>

  <div class="topbar">
    <div class="brand">
      <div class="badge">HG</div>
      <div><div class="brandname">Hello Gorgeous</div><div class="brandsub">MED SPA · OSWEGO, IL</div></div>
    </div>
    <div class="award">🏆 Best of Oswego</div>
  </div>

  <div class="caption" id="cap">
    <div class="rule"></div>
    <div class="eyebrow" id="cap-eyebrow">Advanced Technology</div>
    <div class="title" id="cap-title"></div>
    <div class="sub" id="cap-sub"></div>
  </div>

  <div class="cta">
    <div class="book">Book Your Free Consult</div>
    <div class="phone">(630) 636-6193</div>
  </div>

  <div id="intro">
    <div class="k">Medical Aesthetics · Oswego, IL</div>
    <div class="h">Hello, <span>gorgeous.</span></div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  const segs = [
    { type:'video', src:'assets/solaria-video.mp4', eyebrow:'Advanced Technology', title:'Solaria <em>CO₂</em> Laser', sub:'Ablative resurfacing for tone, texture & true glow.' },
    { type:'image', src:'assets/room-solaria.png', pos:'center 26%', scale:1.06, origin:'center 30%', dur:4600, eyebrow:'The Experience', title:'Care with <em>intention.</em>', sub:'Hands-on medical treatments in our Oswego suite.' },
    { type:'image', src:'assets/glow-hydra.png', pos:'right center', scale:1.78, origin:'right center', dur:5000, eyebrow:'Signature Facials', title:'Real medicine.<br><em>Real glow.</em>', sub:'' },
    { type:'image', src:'assets/lashes.png', pos:'center 10%', scale:1.10, origin:'center', dur:5000, eyebrow:'Lashes & Lifts', title:'Wake up<br><em>gorgeous.</em>', sub:'' },
    { type:'image', src:'assets/lips.png', pos:'center 42%', scale:1.12, origin:'center', dur:5000, eyebrow:'Lip Filler', title:'Naturally<br><em>fuller lips.</em>', sub:'' },
    { type:'image', src:'assets/lips-injection.png', pos:'center 46%', scale:1.12, origin:'center', dur:5000, eyebrow:'Lip Filler', title:'In expert<br><em>hands.</em>', sub:'' },
    { type:'collage', srcs:['assets/peptide-1.png','assets/peptide-2.png','assets/peptide-3.png','assets/peptide-4.png','assets/peptide-5.png','assets/peptide-6.png'], step:720, dur:6000, eyebrow:'Hello Gorgeous RX', title:'Peptide <em>Therapy</em>', sub:'A full medical peptide menu — recovery, metabolism &amp; skin renewal.' },
  ];

  // Preload all still/collage images so fast swaps don't flash blank.
  segs.forEach(s => (s.type === 'collage' ? s.srcs : [s.src]).forEach(u => {
    if (u && !/\.mp4$/.test(u)) { const im = new Image(); im.src = u; }
  }));

  const v = [document.getElementById('v0'), document.getElementById('v1')];
  const imglayer = document.getElementById('imglayer');
  const imgEl = document.getElementById('imgEl');
  const cap = document.getElementById('cap');
  const capE = document.getElementById('cap-eyebrow');
  const capT = document.getElementById('cap-title');
  const capS = document.getElementById('cap-sub');
  let cur = 0, vtoggle = 0, timer = null, collageIv = null;

  function setCaption(i){
    cap.style.opacity = 0; cap.style.transform = 'translateY(10px)';
    setTimeout(() => {
      capE.innerHTML = segs[i].eyebrow; capT.innerHTML = segs[i].title;
      capS.innerHTML = segs[i].sub || ''; capS.style.display = segs[i].sub ? '' : 'none';
      cap.style.opacity = 1; cap.style.transform = 'translateY(0)';
    }, 260);
  }

  function show(i){
    cur = i; const s = segs[i];
    if (timer){ clearTimeout(timer); timer = null; }
    if (collageIv){ clearInterval(collageIv); collageIv = null; }
    setCaption(i);
    if (s.type === 'collage'){
      imgEl.style.objectFit = 'contain';
      imglayer.classList.add('on');
      v[0].classList.remove('on'); v[1].classList.remove('on'); v[0].pause(); v[1].pause();
      let k = 0;
      const step = () => {
        imgEl.style.transition = 'none';
        imgEl.style.opacity = 1;
        imgEl.style.objectPosition = 'center';
        imgEl.style.transformOrigin = 'center';
        imgEl.src = s.srcs[k % s.srcs.length];
        imgEl.style.transform = 'scale(1.0)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          imgEl.style.transition = 'transform ' + (s.step/1000) + 's ease';
          imgEl.style.transform = 'scale(1.04)';
        }));
        k++;
      };
      step();
      collageIv = setInterval(step, s.step);
      timer = setTimeout(advance, s.dur);
    } else if (s.type === 'image'){
      imgEl.style.opacity = 1;
      imgEl.style.transition = 'none';
      imgEl.style.objectFit = s.fit || 'cover';
      imgEl.src = s.src; imgEl.style.objectPosition = s.pos; imgEl.style.transformOrigin = s.origin;
      imgEl.style.transform = 'scale(' + s.scale + ')';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        imgEl.style.transition = 'transform 5.4s ease';
        imgEl.style.transform = 'scale(' + (s.scale + 0.06) + ')';
      }));
      imglayer.classList.add('on');
      v[0].classList.remove('on'); v[1].classList.remove('on'); v[0].pause(); v[1].pause();
      timer = setTimeout(advance, s.dur);
    } else {
      const idx = vtoggle; vtoggle = 1 - vtoggle;
      const vid = v[idx];
      if (vid.dataset.seg !== s.src){ vid.src = s.src; vid.dataset.seg = s.src; vid.load(); }
      vid.currentTime = 0; vid.play().catch(()=>{});
      vid.onended = () => { if (cur === i) advance(); };
      vid.classList.add('on');
      v[1 - idx].classList.remove('on'); v[1 - idx].pause();
      imglayer.classList.remove('on');
    }
  }
  function advance(){ show((cur + 1) % segs.length); }

  // boot
  show(0);
  setTimeout(() => { const el = document.getElementById('intro'); el.style.opacity = 0; setTimeout(()=>el.remove(), 1100); }, 3200);
</script>
</body>
</html>
