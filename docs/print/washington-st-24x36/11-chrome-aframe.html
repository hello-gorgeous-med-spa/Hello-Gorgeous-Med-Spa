<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>24×36 — Chrome A-frame</title>
  <link rel="stylesheet" href="signs.css" />
  <link rel="stylesheet" href="chrome.css" />
  <style>
    .chrome-board .safe {
      inset: 1.15in 0.85in 1.05in 0.85in;
      justify-content: flex-start;
      gap: 0.12in;
    }
    .chrome-frame { width: 100%; }
    .chrome-frame > div { padding: 0.16in 0.18in 0.14in; }
    .list {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      min-height: 0;
    }
    .list .word-svg {
      width: 100%;
      height: auto;
      margin: 0;
      flex: 1 1 0;
      min-height: 0;
    }
    .end { width: 100%; }
    .chrome-board .qr { width: 2.55in; height: 2.55in; }
    .foot { margin-top: 0.08in; }
  </style>
</head>
<body>
  <div class="no-print">
    <p><strong>Sign 11 — Chrome A-frame.</strong> Service names fill the 24×36. Print 24×36, margins none, background graphics on.</p>
    <button type="button" onclick="window.print()">Print / Save PDF</button>
    <a class="btn" href="index.html">All signs</a>
  </div>

  <article class="board chrome-board">
    <svg class="defs" aria-hidden="true">
      <defs>
        <pattern id="pinkChrome" patternUnits="userSpaceOnUse" width="720" height="480">
          <image href="pink-chrome.png" width="720" height="480" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="goldChrome" patternUnits="userSpaceOnUse" width="720" height="480">
          <image href="gold-chrome.png" width="720" height="480" preserveAspectRatio="xMidYMid slice" />
        </pattern>
      </defs>
    </svg>
    <div class="safe">
      <div class="chrome-frame">
        <div>
          <svg class="word-svg" viewBox="0 0 2000 70" role="img" aria-label="Hello Gorgeous">
            <text x="1000" y="56" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="54" letter-spacing="4">HELLO GORGEOUS</text>
          </svg>
          <svg class="word-svg" viewBox="0 0 2000 32" role="img" aria-label="Med Spa Downtown Oswego">
            <text x="1000" y="26" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="20" letter-spacing="8">MED SPA · DOWNTOWN OSWEGO</text>
          </svg>
        </div>
      </div>

      <div class="list">
        <svg class="word-svg" viewBox="0 0 2000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Botox">
          <text x="1000" y="360" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="320" textLength="1900" lengthAdjust="spacingAndGlyphs">BOTOX</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Peptide therapy">
          <text x="1000" y="195" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="185" textLength="1900" lengthAdjust="spacingAndGlyphs">PEPTIDE</text>
          <text x="1000" y="400" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="185" textLength="1900" lengthAdjust="spacingAndGlyphs">THERAPY</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Dermal filler">
          <text x="1000" y="195" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="185" textLength="1900" lengthAdjust="spacingAndGlyphs">DERMAL</text>
          <text x="1000" y="400" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="185" textLength="1900" lengthAdjust="spacingAndGlyphs">FILLER</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Medical grade Class 4 lasers">
          <text x="1000" y="58" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="36" letter-spacing="14">MEDICAL GRADE</text>
          <text x="1000" y="230" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="168" textLength="1900" lengthAdjust="spacingAndGlyphs">CLASS 4</text>
          <text x="1000" y="420" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="168" textLength="1900" lengthAdjust="spacingAndGlyphs">LASERS</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GLP-1 weight loss">
          <text x="1000" y="58" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="36" letter-spacing="14">GLP-1</text>
          <text x="1000" y="230" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="168" textLength="1900" lengthAdjust="spacingAndGlyphs">WEIGHT</text>
          <text x="1000" y="420" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="168" textLength="1900" lengthAdjust="spacingAndGlyphs">LOSS</text>
        </svg>
      </div>

      <div class="end">
        <svg class="word-svg" viewBox="0 0 2000 90" role="img" aria-label="630-636-6193">
          <text x="1000" y="72" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="64" letter-spacing="4">630-636-6193</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 28" role="img" aria-label="Walk-ins welcome, 74 W. Washington">
          <text x="1000" y="22" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="18" letter-spacing="6">WALK-INS WELCOME · 74 W. WASHINGTON</text>
        </svg>
        <div class="foot">
          <p class="scan">Scan to book<br />hellogorgeousmedspa.com</p>
          <div class="qr"><img src="qr-book.png" alt="Scan to book Hello Gorgeous" /></div>
        </div>
      </div>
    </div>
  </article>
</body>
</html>
