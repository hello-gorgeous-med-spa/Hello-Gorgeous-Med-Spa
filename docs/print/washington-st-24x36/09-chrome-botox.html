<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>24×36 — Chrome Botox</title>
  <link rel="stylesheet" href="signs.css" />
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <div class="no-print">
    <p><strong>Sign 9 — Chrome Botox.</strong> One word. Pink chrome + gold chrome on black. Print 24×36, margins none, background graphics on.</p>
    <button type="button" onclick="window.print()">Print / Save PDF</button>
    <a class="btn" href="index.html">All signs</a>
  </div>

  <article class="board chrome-board">
    <svg class="defs" aria-hidden="true">
      <defs>
        <pattern id="pinkChrome" patternUnits="userSpaceOnUse" width="720" height="480">
          <image href="pink-chrome.png" width="720" height="480" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="goldChrome" patternUnits="userSpaceOnUse" width="720" height="480">
          <image href="gold-chrome.png" width="720" height="480" preserveAspectRatio="xMidYMid slice" />
        </pattern>
      </defs>
    </svg>
    <div class="safe">
      <div class="chrome-frame">
        <div>
          <svg class="word-svg" style="width:19in;" viewBox="0 0 2000 90" role="img" aria-label="Hello Gorgeous">
            <text x="1000" y="72" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="64" letter-spacing="8">HELLO GORGEOUS</text>
          </svg>
          <svg class="word-svg small" viewBox="0 0 2000 50" role="img" aria-label="Med Spa Downtown Oswego">
            <text x="1000" y="38" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="28" letter-spacing="10">MED SPA · DOWNTOWN OSWEGO</text>
          </svg>
        </div>
      </div>

      <div>
        <svg class="word-svg" viewBox="0 0 2000 420" role="img" aria-label="Botox">
          <text x="1000" y="340" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="340" letter-spacing="4">BOTOX</text>
        </svg>
        <svg class="word-svg" viewBox="0 0 2000 180" role="img" aria-label="$10 per unit">
          <text x="1000" y="140" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="128">$10 / UNIT</text>
        </svg>
        <svg class="word-svg small" viewBox="0 0 2000 50" role="img" aria-label="First time, NP injected">
          <text x="1000" y="38" text-anchor="middle" fill="url(#goldChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="700" font-size="28" letter-spacing="8">FIRST TIME · NP INJECTED</text>
        </svg>
        <svg class="word-svg phone" viewBox="0 0 2000 160" role="img" aria-label="630-636-6193">
          <text x="1000" y="125" text-anchor="middle" fill="url(#pinkChrome)" font-family="Cinzel Chrome, Cinzel, serif" font-weight="900" font-size="100" letter-spacing="6">630-636-6193</text>
        </svg>
      </div>

      <div class="foot">
        <p class="scan">Scan to book<br />hellogorgeousmedspa.com</p>
        <div class="qr"><img src="qr-botox.png" alt="Scan to book Botox at Hello Gorgeous" /></div>
      </div>
    </div>
  </article>
</body>
</html>
