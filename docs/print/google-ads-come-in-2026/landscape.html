<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Ad — landscape 1200×628</title>
  <style>
    html, body { margin: 0; }
    .ad {
      width: 1200px;
      height: 628px;
      position: relative;
      overflow: hidden;
      background: #0b1228;
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    .ad img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
    }
    .bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 28px 40px 32px;
      background: linear-gradient(180deg, transparent 0%, #0b1228 38%);
      color: #fff;
      text-align: center;
    }
    .bar h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -0.03em; }
    .bar h1 span { color: #ff6ba8; }
    .bar p { margin: 8px 0 0; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <article class="ad">
    <img src="../../../public/images/marketing/hello-gorgeous-storefront-windows-2026.png" alt="" />
    <div class="bar">
      <h1>Come in. <span>We're here for you.</span></h1>
      <p>Downtown Oswego · 630-636-6193</p>
    </div>
  </article>
</body>
</html>
